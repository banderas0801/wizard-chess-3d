<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wizard Chess 3D (Clean-Room)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #07090e;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #f8fafc;
      }
      #canvas-container {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: absolute;
        top: 14px;
        left: 16px;
        z-index: 10;
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(212, 175, 55, 0.4);
        border-radius: 10px;
        padding: 8px 16px;
        font-size: 13px;
        pointer-events: none;
      }
      #hud strong {
        color: #f59e0b;
      }
      #tier-badge {
        margin-left: 8px;
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.1);
        font-weight: bold;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="hud">
      <strong>Wizard Chess 3D</strong> • Tier: <span id="tier-badge">OFF</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
